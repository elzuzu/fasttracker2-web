# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves
# (Pages source: "Deploy from a branch", gh-pages, /). publish.sh does the same from a local machine.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  # Same compiler as the builds tested locally (Homebrew emscripten 6.0.10)
  EMSDK_VERSION: 6.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Emscripten SDK and ports
        uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ./build.sh

      - name: Publish to gh-pages
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R dist/. "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Built site from main@${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
